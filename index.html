<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leather Wallet – Pull a Card</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Barlow:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="viewport" id="viewport">
      <div class="stage" id="stage">
        <div class="floor-shadow"></div>

        <div class="wallet">
          <div class="body"></div>
          <div class="stitch-outer"></div>

          <!-- card in slot 1 (back) -->
          <div
            class="card c1"
            id="card1"
            role="button"
            tabindex="0"
            aria-label="Blue card, click to pull out"
          >
            <span class="bank">Nova Bank</span>
            <svg
              class="wave"
              viewBox="0 0 32 32"
              fill="none"
              stroke="#fff"
              stroke-width="2.4"
              stroke-linecap="round"
            >
              <path d="M9 9c4 4 4 10 0 14" />
              <path d="M15 5c7 7 7 15 0 22" />
              <path d="M21 1c10 10 10 20 0 30" />
            </svg>
            <span class="chip"></span>
            <span class="vis">VISA·X</span>
            <span class="num" id="num1">0000 0000 0000 0000</span>
            <div class="meta">
              <div><small>CARD HOLDER</small><span id="name1">NAME</span></div>
              <div><small>VALID THRU</small><span id="exp1">00/00</span></div>
            </div>
          </div>
          <div class="pocket p1"></div>

          <!-- card in slot 2 (front) -->
          <div
            class="card c2"
            id="card2"
            role="button"
            tabindex="0"
            aria-label="Silver card, click to pull out"
          >
            <span class="bank">Orbit Card</span>
            <svg
              class="wave"
              viewBox="0 0 32 32"
              fill="none"
              stroke="#1c2129"
              stroke-width="2.4"
              stroke-linecap="round"
            >
              <path d="M9 9c4 4 4 10 0 14" />
              <path d="M15 5c7 7 7 15 0 22" />
              <path d="M21 1c10 10 10 20 0 30" />
            </svg>
            <span class="chip"></span>
            <span class="orbs"><i></i><i></i></span>
            <span class="num" id="num2">0000 0000 0000 0000</span>
            <div class="meta">
              <div><small>CARD HOLDER</small><span id="name2">NAME</span></div>
              <div><small>VALID THRU</small><span id="exp2">00/00</span></div>
            </div>
          </div>
          <div class="pocket p2">
            <div class="stamp">ARKADE · LEATHER GOODS</div>
          </div>
        </div>
      </div>
    </div>

    <div class="ui">
      <p>Click a card to pull it out · click again to slide it back</p>
      <button class="btn" id="regen">Generate new numbers</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
